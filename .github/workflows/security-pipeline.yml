name: DevSecOps Security & Compliance Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  security-pipeline:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install Dependencies & Tools
        run: |
          python -m pip install --upgrade pip
          pip install bandit pip-audit checkov
          if [ -f app/requirements.txt ]; then pip install -r app/requirements.txt; fi

      - name: Run Bandit (SAST)
        run: bandit -r app/ || true

      - name: Run pip-audit (SCA)
        run: pip-audit -r app/requirements.txt || true

      - name: Run Checkov (IaC)
        run: checkov -d infrastructure/ || true

      - name: Execute Policy Gatekeeper
        run: python security_policy/gatekeeper.py
